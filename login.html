<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Login - Soft Logs Global</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b16;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .box {
      width: 90%;
      max-width: 400px;
      background: #15152a;
      padding: 30px;
      border-radius: 15px;
    }

    h1 {
      text-align: center;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      margin: 8px 0;
      border: 0;
      border-radius: 8px;
      background: #24243d;
      color: white;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: 0;
      border-radius: 8px;
      background: #7c3aed;
      color: white;
      font-size: 16px;
    }

    p {
      text-align: center;
      color: #aaa;
    }

    a {
      color: #a78bfa;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>Customer Login</h1>

    <form>
      <input type="email" placeholder="Email Address" required>
      <input type="password" placeholder="Password" required>

      <button type="submit">Login</button>
    </form>

    <p>
      Don't have an account?
      <a href="register.html">Sign Up</a>
    </p>
  </div>

</body>
</html>
